name: Setup
description: Install the pinned repository toolchain and frozen dependencies
inputs:
  node-version:
    description: Node version
    default: 26.13.0
  bun-version:
    description: Optional Bun version
    default: ""
  deno-version:
    description: Optional Deno version
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      if: inputs.bun-version != ''
      with:
        bun-version: ${{ inputs.bun-version }}
    - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
      if: inputs.deno-version != ''
      with:
        deno-version: ${{ inputs.deno-version }}
    - shell: bash
      run: pnpm install --frozen-lockfile
